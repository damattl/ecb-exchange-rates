services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://${MONGO_USER:?MONGO_USER is required}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:?MONGO_DB is required}
    depends_on:
      - mongo
    networks:
      - internal

  mongo:
    image: mongo:6
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:?MONGO_DB is required}
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

volumes:
  mongo-data:
    name: ecb-exchange-ranges.mongo-data.prod

networks:
  internal:
