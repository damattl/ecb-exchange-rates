services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - internal

  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

volumes:
  mongo-data:

networks:
  internal:
